name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to checkout (例: v0.2.38)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v6 ではキャッシュ機能が非オープンソースの別ライブラリへ切り出され、
      # 利用に Gradle 社の Terms of Use への同意が必要になった。
      # Node 24 対応は v5 で済んでいるので、ここは v5 に留める。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore (require signing secrets)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 配布物を debug 鍵で署名するのは禁止。署名シークレットが無ければリリースを中止する。
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::リリース署名シークレット (SIGNING_KEYSTORE_BASE64 等) が未設定です。debug 鍵での配布ビルドは禁止のためリリースを中止します。GitHub の Settings > Secrets に署名鍵を登録してください。"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "keystore.properties written"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Print APK info
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: foldex-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f release.keystore keystore.properties
