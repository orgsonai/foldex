name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to checkout (例: v0.2.38)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v6 ではキャッシュ機能が非オープンソースの別ライブラリへ切り出され、
      # 利用に Gradle 社の Terms of Use への同意が必要になった。
      # Node 24 対応は v5 で済んでいるので、ここは v5 に留める。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore (require signing secrets)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 配布物を debug 鍵で署名するのは禁止。署名シークレットが無ければリリースを中止する。
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::リリース署名シークレット (SIGNING_KEYSTORE_BASE64 等) が未設定です。debug 鍵での配布ビルドは禁止のためリリースを中止します。GitHub の Settings > Secrets に署名鍵を登録してください。"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "keystore.properties written"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Print APK info
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: foldex-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # リリース本文を組み立てる。F-Droid 用の changelog をそのまま流用し、
      # 前回タグ以降に追加された分を全部載せる (複数バージョンを 1 タグでまとめて
      # 出すことがあるため、今回の versionCode だけでは足りない)。
      # 本文が空のままリリースを作らせないよう、最後に必ず中身を検査する。
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          JA_DIR="fastlane/metadata/android/ja-JP/changelogs"
          EN_DIR="fastlane/metadata/android/en-US/changelogs"

          # 前回タグ以降に追加された changelog を新しい順に拾う。
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          CODES=""
          if [ -n "${PREV}" ]; then
            CODES="$(git diff --name-only --diff-filter=A "${PREV}..${TAG}" -- "${JA_DIR}" \
              | xargs -r -n1 basename | sed 's/\.txt$//' | sort -rn || true)"
          fi
          # 前回タグが無い / 差分が取れないときは、今の versionCode 1 つで作る。
          if [ -z "${CODES}" ]; then
            CODES="$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts \
              | grep -oE '[0-9]+' | head -1)"
          fi

          # 改行区切りの読み込みで回す (for + 変数展開はシェルの単語分割設定に左右されるため)。
          emit_changelogs() {
            dir="$1"
            printf '%s\n' "${CODES}" | while IFS= read -r c; do
              if [ -n "${c}" ] && [ -f "${dir}/${c}.txt" ]; then
                cat "${dir}/${c}.txt"
                echo
              fi
            done
          }

          {
            echo "## 変更点"
            echo
            emit_changelogs "${JA_DIR}"
            if [ -n "$(emit_changelogs "${EN_DIR}")" ]; then
              echo "<details><summary>English</summary>"
              echo
              emit_changelogs "${EN_DIR}"
              echo "</details>"
            fi
          } > RELEASE_NOTES.md

          # changelog が 1 件も無ければ、タグの注釈メッセージで代替する。
          if [ "$(grep -cve '^\s*$' RELEASE_NOTES.md)" -le 1 ]; then
            git tag -l --format='%(contents)' "${TAG}" > RELEASE_NOTES.md
          fi

          # それでも空ならリリースを中止する。本文の無いリリースは作らない。
          if [ ! -s RELEASE_NOTES.md ] || [ "$(grep -cve '^\s*$' RELEASE_NOTES.md)" -eq 0 ]; then
            echo "::error::リリース本文が空です。${JA_DIR}/<versionCode>.txt を用意するか、git tag -a でタグに注釈を付けてください。"
            exit 1
          fi

          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: RELEASE_NOTES.md
          # 本文の後ろにコミット一覧と Full Changelog のリンクが自動で付く。
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f release.keystore keystore.properties RELEASE_NOTES.md
